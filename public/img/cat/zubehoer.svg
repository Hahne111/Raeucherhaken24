<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170" role="img" aria-label="Räucherzubehör: Räucherschnur, Thermometer und Reinigungsbürste auf Holz">
  <defs>
    <linearGradient id="zb-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332415"/><stop offset=".5" stop-color="#22180d"/><stop offset="1" stop-color="#100b06"/>
    </linearGradient>
    <radialGradient id="zb-light" cx=".55" cy=".2" r=".8">
      <stop offset="0" stop-color="#ffcf8d" stop-opacity=".28"/><stop offset="1" stop-color="#ffcf8d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zb-rope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9bd8b"/><stop offset=".5" stop-color="#ac8a56"/><stop offset="1" stop-color="#6f5530"/>
    </linearGradient>
    <linearGradient id="zb-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eff3"/><stop offset=".45" stop-color="#9ba8b1"/><stop offset="1" stop-color="#5a666f"/>
    </linearGradient>
    <linearGradient id="zb-handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3237"/><stop offset="1" stop-color="#12171a"/>
    </linearGradient>
    <linearGradient id="zb-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04090e" stop-opacity="0"/><stop offset="1" stop-color="#04090e" stop-opacity=".86"/>
    </linearGradient>
  </defs>
  <rect width="300" height="170" fill="url(#zb-wood)"/>
  <g opacity=".45" fill="#160f07">
    <rect y="16" width="300" height="3"/><rect y="52" width="300" height="3"/><rect y="88" width="300" height="3"/><rect y="124" width="300" height="3"/>
  </g>
  <g opacity=".25" stroke="#5a4227" stroke-width=".8"><path d="M64 0V170M156 0V170M242 0V170"/></g>
  <rect width="300" height="170" fill="url(#zb-light)"/>
  <!-- Schnurrolle -->
  <g transform="translate(64 88)">
    <ellipse cx="0" cy="22" rx="42" ry="11" fill="#070c10" opacity=".55"/>
    <g fill="none" stroke="url(#zb-rope)" stroke-width="6">
      <ellipse cx="0" cy="0" rx="36" ry="20"/><ellipse cx="0" cy="4" rx="30" ry="16"/>
      <ellipse cx="0" cy="8" rx="23" ry="12"/><ellipse cx="2" cy="-4" rx="16" ry="9"/>
    </g>
    <g fill="none" stroke="#efdcb4" stroke-width="1" opacity=".5">
      <ellipse cx="0" cy="-2" rx="36" ry="20"/><ellipse cx="0" cy="6" rx="23" ry="12"/>
    </g>
    <path d="M34 6c14 6 22 14 26 26" stroke="url(#zb-rope)" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Thermometer -->
  <g transform="translate(196 74)">
    <ellipse cx="0" cy="46" rx="34" ry="10" fill="#070c10" opacity=".55"/>
    <rect x="-5" y="12" width="10" height="34" rx="4" fill="url(#zb-steel)"/>
    <circle cx="0" cy="0" r="30" fill="#1b2126"/>
    <circle cx="0" cy="0" r="27" fill="url(#zb-steel)"/>
    <circle cx="0" cy="0" r="22" fill="#f7f4ec"/>
    <g stroke="#33404a" stroke-width="1.5" stroke-linecap="round">
      <path d="M0 -19V-15M13.4 -13.4l-2.8 2.8M19 0h-4M13.4 13.4l-2.8-2.8M0 19v-4M-13.4 13.4l2.8-2.8M-19 0h4M-13.4 -13.4l2.8 2.8"/>
    </g>
    <path d="M0 0L11 -10" stroke="#b5442c" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.6" fill="#33404a"/>
    <path d="M-14 8a16 16 0 0 0 28 0" stroke="#c8722c" stroke-width="2.4" fill="none" opacity=".7"/>
  </g>
  <!-- Bürste -->
  <g transform="translate(150 140) rotate(-8)">
    <rect x="-70" y="-8" width="96" height="14" rx="6" fill="url(#zb-handle)"/>
    <rect x="-66" y="-5" width="88" height="4" rx="2" fill="#414a51" opacity=".7"/>
    <rect x="26" y="-11" width="46" height="20" rx="4" fill="#3b2a17"/>
    <g stroke="#8d7a5e" stroke-width="1.6" stroke-linecap="round">
      <path d="M30 9v12M36 9v13M42 9v12M48 9v14M54 9v12M60 9v13M66 9v11"/>
    </g>
    <circle cx="-68" cy="-1" r="5" fill="none" stroke="#79848c" stroke-width="2"/>
  </g>
  <rect y="72" width="300" height="98" fill="url(#zb-shade)"/>
</svg>
