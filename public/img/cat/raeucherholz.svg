<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170" role="img" aria-label="Räucherholz-Chips in einer Holzkiste mit Nordsee-Aufdruck">
  <defs>
    <linearGradient id="hz-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16374e"/><stop offset=".55" stop-color="#10293a"/><stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="hz-crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e5c31"/><stop offset=".5" stop-color="#5c421f"/><stop offset="1" stop-color="#3a2913"/>
    </linearGradient>
    <linearGradient id="hz-chipA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5b573"/><stop offset="1" stop-color="#a9763a"/>
    </linearGradient>
    <linearGradient id="hz-chipB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf9a56"/><stop offset="1" stop-color="#8a5c2a"/>
    </linearGradient>
    <linearGradient id="hz-chipC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1cf9b"/><stop offset="1" stop-color="#bd8b4c"/>
    </linearGradient>
    <radialGradient id="hz-glow" cx=".45" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffc77f" stop-opacity=".3"/><stop offset="1" stop-color="#ffc77f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hz-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04090e" stop-opacity="0"/><stop offset="1" stop-color="#04090e" stop-opacity=".86"/>
    </linearGradient>
  </defs>
  <rect width="300" height="170" fill="url(#hz-bg)"/>
  <g opacity=".3" stroke="#2c4f66" stroke-width="1">
    <path d="M0 22h300M0 44h300M0 66h300"/>
  </g>
  <rect width="300" height="170" fill="url(#hz-glow)"/>
  <!-- Chips-Haufen hinter der Kiste -->
  <g opacity=".9">
    <path d="M0 96c40-16 84-22 126-18 48 5 96 2 150-14v106H0z" fill="#3c2a14"/>
  </g>
  <!-- Kiste -->
  <g>
    <path d="M42 74h216v92H42z" fill="url(#hz-crate)"/>
    <g fill="#472f15" opacity=".75">
      <rect x="42" y="92" width="216" height="4"/><rect x="42" y="116" width="216" height="4"/><rect x="42" y="140" width="216" height="4"/>
    </g>
    <rect x="42" y="74" width="216" height="8" fill="#8a6536"/>
    <rect x="42" y="74" width="10" height="92" fill="#3c2a13"/>
    <rect x="248" y="74" width="10" height="92" fill="#3c2a13"/>
    <g fill="#e8d7b4" opacity=".8" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">
      <text x="150" y="132">NORDSEE</text>
    </g>
    <path d="M138 140h24M150 138v6" stroke="#e8d7b4" stroke-width="1.6" opacity=".6"/>
  </g>
  <!-- Chips im und vor dem Kasten -->
  <g>
    <g fill="url(#hz-chipA)">
      <path d="M58 62l24-8 16 10-22 10z"/><path d="M104 52l26-6 12 12-24 8z"/>
      <path d="M152 56l26-10 16 12-24 10z"/><path d="M202 62l26-8 14 12-26 8z"/>
      <path d="M80 78l22-6 12 10-20 8z"/>
    </g>
    <g fill="url(#hz-chipB)">
      <path d="M70 54l20-10 14 8-18 10z"/><path d="M128 44l22-8 12 10-20 8z"/>
      <path d="M178 46l22-8 14 10-22 8z"/><path d="M228 56l20-8 14 10-22 8z"/>
      <path d="M44 70l20-8 12 10-20 8z"/>
    </g>
    <g fill="url(#hz-chipC)">
      <path d="M92 62l18-6 10 8-16 7z"/><path d="M156 40l18-6 10 8-16 8z"/>
      <path d="M212 52l16-6 10 8-16 7z"/><path d="M120 70l18-6 10 8-16 8z"/>
      <path d="M186 68l18-6 10 8-16 8z"/>
    </g>
    <g fill="url(#hz-chipB)" opacity=".95">
      <path d="M20 152l22-8 14 10-22 8z"/><path d="M252 150l24-8 14 10-24 8z"/>
      <path d="M0 138l18-6 12 8-18 8z"/><path d="M274 136l20-6 8 8-18 8z"/>
    </g>
  </g>
  <rect y="72" width="300" height="98" fill="url(#hz-shade)"/>
</svg>
