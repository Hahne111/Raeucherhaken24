<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170" role="img" aria-label="Schwarzer Räucherofen mit Thermometer vor Fischerbooten im Hafen">
  <defs>
    <linearGradient id="ro-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14344b"/><stop offset=".6" stop-color="#1e4d68"/><stop offset="1" stop-color="#123146"/>
    </linearGradient>
    <linearGradient id="ro-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31383d"/><stop offset=".22" stop-color="#14181c"/>
      <stop offset=".62" stop-color="#0b0e11"/><stop offset=".9" stop-color="#232a30"/><stop offset="1" stop-color="#0d1114"/>
    </linearGradient>
    <linearGradient id="ro-door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22282d"/><stop offset=".5" stop-color="#101417"/><stop offset="1" stop-color="#1c2227"/>
    </linearGradient>
    <linearGradient id="ro-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04090e" stop-opacity="0"/><stop offset="1" stop-color="#04090e" stop-opacity=".88"/>
    </linearGradient>
    <radialGradient id="ro-lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb765" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="170" fill="url(#ro-sky)"/>
  <g opacity=".65" fill="#0d2437">
    <ellipse cx="60" cy="26" rx="90" ry="24"/><ellipse cx="220" cy="18" rx="100" ry="22"/>
  </g>
  <!-- Hafen -->
  <g opacity=".85">
