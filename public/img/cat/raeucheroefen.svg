    </g>
    <g fill="#0a1b26">
      <path d="M8 104l16-12h44l14 12z"/><path d="M196 104l14-12h48l16 12z"/>
      <path d="M96 104l12-9h34l10 9z"/>
    </g>
    <g fill="#ffd79a" opacity=".7">
      <rect x="30" y="86" width="5" height="4"/><rect x="58" y="88" width="5" height="4"/>
      <rect x="216" y="86" width="5" height="4"/><rect x="248" y="88" width="5" height="4"/>
    </g>
    <circle cx="33" cy="70" r="9" fill="url(#ro-lamp)"/><circle cx="250" cy="74" r="9" fill="url(#ro-lamp)"/>
  </g>
  <!-- Wasser -->
  <g opacity=".5" fill="#1a4a66">
    <rect y="118" width="300" height="4"/><rect y="128" width="300" height="3"/><rect y="139" width="300" height="3"/>
  </g>
  <!-- Ofen -->
  <g>
    <rect x="106" y="30" width="18" height="20" rx="2" fill="#171c20"/>
    <rect x="103" y="26" width="24" height="7" rx="2" fill="#22282d"/>
    <rect x="92" y="48" width="86" height="118" rx="3" fill="url(#ro-body)"/>
    <rect x="92" y="48" width="86" height="6" rx="2" fill="#2c343a"/>
    <rect x="99" y="60" width="72" height="84" rx="2" fill="url(#ro-door)" stroke="#39424a" stroke-width="1.2"/>
    <rect x="104" y="66" width="62" height="72" rx="1.5" fill="none" stroke="#2b3238" stroke-width="1"/>
    <circle cx="135" cy="72" r="10" fill="#0f1316" stroke="#5b666e" stroke-width="1.6"/>
    <circle cx="135" cy="72" r="7" fill="#e8eef2" opacity=".9"/>
    <path d="M135 72l4-4" stroke="#b5442c" stroke-width="1.4" stroke-linecap="round"/>
